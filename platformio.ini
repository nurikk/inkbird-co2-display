; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-3248s035]
platform = platformio/espressif32
board = esp32dev
framework = espidf
build_type = debug  ; Enable debug symbols and exception decoder
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = custom_monitor.py
upload_speed = 500000
upload_flags =
  --after=watchdog_reset
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = partitions_singleapp_large.csv
board_upload.flash_size = 4MB
build_flags =
  -D SCREEN_WIDTH=320
  -D SCREEN_HEIGHT=480
  -D SCREEN_ROTATE=0
  -D UI_WIDTH=320
  -D UI_HEIGHT=480
  -D PANEL_BGR=1
  -D PANEL_INVERT_COLOR=0
  -D PANEL_BL_ACTIVE_LOW=0
  ; TFT SPI pins (ST7796)
  -D EPD_PIN_MOSI=13
  -D EPD_PIN_MISO=12
  -D EPD_PIN_SCK=14
  -D EPD_PIN_CS=15
  -D EPD_PIN_DC=2
  -D EPD_PIN_RST=-1
  -D EPD_PIN_BL=27
  ; Touch pins (GT911 I2C)
  -D GT911_PIN_SDA=33
  -D GT911_PIN_SCL=32
  -D GT911_PIN_INT=36
  ; Touch pins (XPT2046 SPI - unused on this board)
  -D XPT2046_PIN_CLK=14
  -D XPT2046_PIN_CS=33
  -D XPT2046_PIN_DIN=13
  -D XPT2046_PIN_DOUT=12
  -D XPT2046_PIN_IRQ=36

; ESP32-S3 with 2.8" TFT display (240x320)
; Board: https://www.aliexpress.com/item/1005008556193252.html
; Note: Display pins may need adjustment - check your specific board's pinout
[env:esp32-s3-28tft]
platform = platformio/espressif32
board = esp32-s3-devkitc-1
framework = espidf
build_type = debug
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = custom_monitor.py
upload_speed = 460800
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = partitions_singleapp_large.csv
board_upload.flash_size = 8MB
build_flags =
  -D SCREEN_WIDTH=240
  -D SCREEN_HEIGHT=320
  -D SCREEN_ROTATE=1
  -D UI_WIDTH=320
  -D UI_HEIGHT=240
  -D PANEL_BGR=0
  -D PANEL_INVERT_COLOR=0
  -D PANEL_BL_ACTIVE_LOW=0
  ; TFT SPI pins (ILI9341)
  -D EPD_PIN_MOSI=45
  -D EPD_PIN_MISO=46
  -D EPD_PIN_SCK=3
  -D EPD_PIN_CS=14
  -D EPD_PIN_DC=47
  -D EPD_PIN_RST=21
  -D EPD_PIN_BL=-1
  ; Touch pins (XPT2046 SPI)
  -D XPT2046_PIN_CLK=42
  -D XPT2046_PIN_CS=1
  -D XPT2046_PIN_DIN=2
  -D XPT2046_PIN_DOUT=41
  -D XPT2046_PIN_IRQ=-1
  ; Touch pins (GT911 I2C - unused on this board)
  -D GT911_PIN_SDA=42
  -D GT911_PIN_SCL=41
  -D GT911_PIN_INT=-1
